# Checks that run on your machine before every commit, so secrets and broken
# code never reach the repository in the first place. CI runs the same checks
# again, because hooks can be skipped.
#
#   pip install pre-commit && pre-commit install
#
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--config, ledgerline/pyproject.toml]
        files: ^ledgerline/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
