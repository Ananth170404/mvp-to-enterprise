# Continuous integration for Ledgerline (guide Chapter 2).
#
# Every pull request and every push to main runs the checks a careful person
# would run by hand before a release. Target: under 10 minutes, or people
# start working around it.
#
# Actions are pinned to a full commit SHA, not a tag: a tag can be moved to
# point at different code, a commit SHA can't.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older pull-request run. On main, runs queue
  # instead: cancelling a deploy halfway (mid-migration) is worse than waiting.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: ledgerline

env:
  PYTHON_VERSION: "3.12"
  # Scanner and signer versions, pinned (Chapter 8). Trivy is installed from its
  # release tarball and checked against this SHA-256, not through
  # aquasecurity/trivy-action: in March 2026 attackers moved that action's tags
  # to credential-stealing code. A pinned version plus a checksum can't be moved.
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
  COSIGN_VERSION: v3.1.4
  # Who may sign images: this repository's CI workflow, on main. Deploys refuse
  # an image whose signature doesn't name exactly this identity.
  SIGNER: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ledgerline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (style, likely bugs, security patterns)
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Eval harness runs (fake provider; checks the harness, not a model)
        run: |
          python -m scripts.generate_invoices --count 30 --seed 7
          python -m scripts.run_evals --provider fake --min-accuracy 1.0

  migrations:
    name: Migrations on real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ledgerline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerline"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ledgerline:ci-only@localhost:5432/ledgerline
      MIGRATION_DATABASE_URL: postgresql+psycopg://ledgerline:ci-only@localhost:5432/ledgerline
      APP_DB_PASSWORD: ci-only-app
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ledgerline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade an empty database to the latest schema
        run: alembic upgrade head
      - name: Models and migrations agree (catches "changed the model, forgot the migration")
        run: alembic check
      - name: Every migration can be reversed
        run: alembic downgrade base && alembic upgrade head
      - name: Least-privilege app user can be created
        run: python -m app.db_roles
      - name: Tenants are isolated in the database (row-level security, Chapter 7)
        # As the app's own database user: a query without a tenant filter, an
        # update of another tenant's row and a write into another tenant must
        # all find nothing or be refused.
        run: python -m scripts.rls_check
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+psycopg://ledgerline_app:ci-only-app@localhost:5432/ledgerline
      - name: Two migration runs at once don't collide
        run: |
          alembic downgrade base
          alembic upgrade head & first=$!
          alembic upgrade head; second=$?
          wait $first; first=$?
          test "$first" -eq 0 && test "$second" -eq 0
          alembic current | grep -q "(head)"

  security:
    name: Secrets, dependencies and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history: a secret deleted later is still leaked
      - name: Scan for committed secrets
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Known vulnerabilities in production dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
      - name: Install Trivy (pinned version, checksum verified)
        working-directory: .
        run: |
          curl -fsSLo /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version
      - name: Infrastructure misconfigurations (Terraform)
        # Fails on HIGH or CRITICAL unless the finding is listed, with a reason
        # and an expiry date, in .trivyignore.yaml.
        working-directory: ledgerline/infra
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --ignorefile ../.trivyignore.yaml .

  eval-gate:
    name: Model eval (when extraction changes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the prompt, schema or model code change?
        id: changes
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^ledgerline/app/(extraction|extraction_schema)\.py|^ledgerline/app/llm/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant == 'true' && env.GEMINI_API_KEY != ''
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ledgerline/requirements-dev.txt
      - name: Run a small real eval and fail below 90% all-fields-correct
        if: steps.changes.outputs.relevant == 'true' && env.GEMINI_API_KEY != ''
        run: |
          pip install -r requirements-dev.txt
          python -m scripts.generate_invoices --count 30 --seed 7
          python -m scripts.run_evals --provider gemini --models gemini-3.5-flash-lite \
            --limit 12 --sleep 4 --min-accuracy 0.9
      - name: Skipped
        if: steps.changes.outputs.relevant != 'true' || env.GEMINI_API_KEY == ''
        run: echo "No extraction changes, or no GEMINI_API_KEY secret configured; eval skipped."

  build:
    name: Build and smoke-test the production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-test, migrations, security]
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      # Publish only on pushes to main, and only once AWS is configured.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_REGION != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the runtime image, tagged with the commit SHA
        run: |
          docker build --target runtime \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ledgerline:${{ github.sha }} .
      - name: The image starts and answers its liveness check
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e APP_ENV=development -e LLM_PROVIDER=fake -e STORAGE_BACKEND=local \
            -e STORAGE_DIR=/tmp/storage -e DATABASE_URL=postgresql+psycopg://nobody:x@localhost:1/none \
            ledgerline:${{ github.sha }}
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/livez && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: The image contains no test tools or generator
        # (A line starting with `!` never fails a bash step, so test explicitly.)
        run: |
          for module in pytest reportlab; do
            if docker run --rm "ledgerline:${{ github.sha }}" python -c "import $module" 2>/dev/null; then
              echo "::error::$module is in the runtime image"
              exit 1
            fi
          done
      - name: Install Trivy (pinned version, checksum verified)
        working-directory: .
        run: |
          curl -fsSLo /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy --version
      - name: Known vulnerabilities in the image (OS packages and Python libraries)
        # Fails on CRITICAL vulnerabilities that have a fix available; HIGH ones
        # are listed in the log so someone sees them. Unfixed ones can't be
        # acted on by us and would only teach people to ignore red builds.
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed "ledgerline:${{ github.sha }}"
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "ledgerline:${{ github.sha }}"
      - name: Software bill of materials (what exactly is in the image)
        run: trivy image --format cyclonedx --output sbom.cdx.json "ledgerline:${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ledgerline/sbom.cdx.json
          retention-days: 90
      # ---- Publish. The image pushed is the exact one built and tested above.
      # Credentials: a push-only IAM user's key in GitHub secrets (infra/staging/
      # github_ci.tf explains why not OIDC on this account). Secrets are never
      # given to pull requests from forks, and only these main-branch steps use them.
      - name: Log in to AWS
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push the tested image, tagged with the commit SHA
        id: push
        if: env.PUBLISH == 'true'
        run: |
          tagged="${{ steps.ecr.outputs.registry }}/ledgerline:${{ github.sha }}"
          docker tag "ledgerline:${{ github.sha }}" "$tagged"
          docker push "$tagged"
          # From here on the image is named by its digest (a hash of its
          # contents), so what is signed and deployed is exactly what was
          # scanned, whatever happens to tags.
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "$tagged")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$tagged\` = \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  # Sign the pushed image, and attach its SBOM as a signed attestation.
  # "Keyless": no signing key to store or leak. GitHub gives this job a
  # short-lived identity token (id-token: write); Sigstore's certificate
  # authority turns it into a 10-minute certificate naming this workflow and
  # branch, and the signature is recorded in Sigstore's public transparency log.
  # (This GitHub token is separate from AWS: it doesn't need the AWS OIDC
  # federation that this account blocks, see infra/staging/github_ci.tf.)
  sign:
    name: Sign the image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: needs.build.outputs.image != ''
    permissions:
      contents: read
      id-token: write # only this job can ask GitHub for an identity token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ledgerline
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Sign, and attest the SBOM
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE"
          echo "Signed \`$IMAGE\` as \`$SIGNER\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, sign]
    # Only when an image was pushed, and once the ECS environment exists
    # (set the ECS_CLUSTER variable after `terraform apply` in Step 6).
    if: needs.build.outputs.image != '' && vars.ECS_CLUSTER != ''
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging # one deploy at a time, never cancelled midway
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Refuse an image this workflow didn't sign
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          cosign verify --certificate-identity "$SIGNER" --certificate-oidc-issuer "$SIGNER_ISSUER" "$IMAGE" > /dev/null
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$SIGNER_ISSUER" "$IMAGE" > /dev/null
          echo "Signature and SBOM attestation verified for $IMAGE"
      - name: Migrate, then roll out the new version
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
        run: bash scripts/deploy_ecs.sh
      - name: Summary
        run: echo "Deployed \`${{ needs.build.outputs.image }}\` to ${{ vars.STAGING_URL }}" >> "$GITHUB_STEP_SUMMARY"

  # Promotion: the SAME image, already deployed and running in staging, goes
  # to production, but only after a human approves. The approval is a rule on
  # the GitHub "production" environment (Settings > Environments > production >
  # Required reviewers); this job waits for it. Production's AWS key is a secret
  # of that environment, so no other job can read it.
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, deploy-staging]
    if: needs.build.outputs.image != '' && vars.PRODUCTION_ECS_CLUSTER != ''
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # Distinct names: if the environment secrets were missing, the job
          # fails instead of quietly falling back to staging's credentials.
          aws-access-key-id: ${{ secrets.PRODUCTION_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PRODUCTION_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Refuse an image this workflow didn't sign
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          cosign verify --certificate-identity "$SIGNER" --certificate-oidc-issuer "$SIGNER_ISSUER" "$IMAGE" > /dev/null
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer "$SIGNER_ISSUER" "$IMAGE" > /dev/null
          echo "Signature and SBOM attestation verified for $IMAGE"
      - name: Migrate, then roll out the tested image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: ${{ vars.PRODUCTION_ECS_CLUSTER }}
          DESIRED_COUNT: "2" # one task per availability zone
        run: bash scripts/deploy_ecs.sh
      - name: Production answers through its public address
        run: |
          for _ in $(seq 1 12); do
            curl -fsS "${{ vars.PRODUCTION_URL }}/readyz" && exit 0
            sleep 10
          done
          echo "::error::${{ vars.PRODUCTION_URL }}/readyz did not return 200"
          exit 1
      - name: Summary
        run: echo "Promoted \`${{ needs.build.outputs.image }}\` to production (${{ vars.PRODUCTION_URL }})" >> "$GITHUB_STEP_SUMMARY"
