# Migrations as a one-off Job: the same command as the ECS migrate task and
# the Compose `migrate` service. Kubernetes retries it (backoffLimit) while
# Postgres is still starting, and deletes the finished Job after an hour.
#
# For each new release: delete the old Job and apply again (Jobs are
# immutable), or have your deploy tool run it as a pre-upgrade hook
# (Helm hooks, Argo CD sync waves).
apiVersion: batch/v1
kind: Job
metadata:
  name: ledgerline-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: ledgerline:local
          command: ["sh", "-c", "alembic upgrade head && python -m app.db_roles && python -m app.seed"]
          envFrom:
            - configMapRef: { name: ledgerline-config }
          env:
            - name: MIGRATION_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: ledgerline-db, key: owner-password }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: ledgerline-db, key: app-password }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
