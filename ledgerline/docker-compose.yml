# Ledgerline local development stack.
#
# Postgres, a one-off `migrate` job, and the API. Migrations are their own step,
# like in a real deploy: the API never migrates the database on start.
# No Redis or Celery yet; those arrive in Chapter 6, when the pain is real.

x-app: &app
  build:
    context: .
    target: dev
  env_file: .env
  environment:
    APP_ENV: development
    # The app connects as a least-privilege user; migrations as the schema owner.
    DATABASE_URL: postgresql+psycopg://ledgerline_app:${APP_DB_PASSWORD:-app-dev-pw}@db:5432/ledgerline
    MIGRATION_DATABASE_URL: postgresql+psycopg://ledgerline:${POSTGRES_PASSWORD:-ledgerline-dev}@db:5432/ledgerline
    STORAGE_BACKEND: local
    STORAGE_DIR: /data/storage
  volumes:
    - storage:/data/storage
    - ./data:/app/data

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerline-dev}
      POSTGRES_DB: ledgerline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    # 1. apply migrations as the owner  2. create/refresh the app's restricted
    # user  3. load demo users and POs (development only; refuses in production)
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://ledgerline:${POSTGRES_PASSWORD:-ledgerline-dev}@db:5432/ledgerline
      MIGRATION_DATABASE_URL: postgresql+psycopg://ledgerline:${POSTGRES_PASSWORD:-ledgerline-dev}@db:5432/ledgerline
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app-dev-pw}
      STORAGE_BACKEND: local
      STORAGE_DIR: /data/storage
    command: sh -c "alembic upgrade head && python -m app.db_roles && python -m app.seed"
    restart: "no"

  api:
    <<: *app
    ports:
      - "8007:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
