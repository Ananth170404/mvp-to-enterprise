<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledgerline{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <a class="brand" href="/invoices">Ledgerline <span class="muted">v0</span></a>
    {% if user %}
    <div class="who">
      <span>{{ user.name }} · {{ user.role }}</span>
      <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><button class="secondary" type="submit">Sign out</button></form>
    </div>
    {% endif %}
  </header>
  <main>
    {% if message %}<div class="msg">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
