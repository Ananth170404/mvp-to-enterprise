<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledgerline{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    :root {
      --ink: #1d2433; --muted: #5f6b7a; --line: #dde2e8; --paper: #f6f7f9; --card: #fff;
      --accent: #2f5d8a; --ok: #23784b; --warn: #a1640a; --err: #b3261e; --info: #4a5d75;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
    header a.brand { font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: .2px; }
    header .who { color: var(--muted); font-size: 14px; display: flex; gap: 12px; align-items: center; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    a { color: var(--accent); }
    button, .btn { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
    button.secondary { background: #fff; color: var(--accent); }
    button.danger { background: #fff; color: var(--err); border-color: var(--err); }
    input[type=text], input[type=date] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; width: 100%; }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 3px; }
    .status { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #e8edf3; color: var(--info); white-space: nowrap; }
    .status.approved { background: #e3f3ea; color: var(--ok); }
    .status.rejected, .status.extraction_failed { background: #fbe9e7; color: var(--err); }
    .status.needs_review { background: #fdf2e0; color: var(--warn); }
    .flag { padding: 6px 10px; border-left: 3px solid; margin-bottom: 6px; background: #fafbfc; font-size: 14px; }
    .flag.error { border-color: var(--err); } .flag.warning { border-color: var(--warn); } .flag.info { border-color: var(--info); }
    .flag code { font-size: 12px; color: var(--muted); }
    .msg { padding: 10px 14px; background: #eaf1f8; border: 1px solid #c9d9ea; border-radius: 6px; margin-bottom: 16px; }
    .muted { color: var(--muted); font-size: 13px; }
    .grid { display: grid; gap: 16px; }
    .row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
    @media (min-width: 900px) { .two { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/invoices">Ledgerline <span class="muted">v0</span></a>
    {% if user %}
    <div class="who">
      <span>{{ user.name }} · {{ user.role }}</span>
      <form method="post" action="/logout"><button class="secondary" type="submit">Switch user</button></form>
    </div>
    {% endif %}
  </header>
  <main>
    {% if message %}<div class="msg">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
