  build:
    name: Build and smoke-test the production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-test, migrations, security]
    env:
      # Publish only on pushes to main, and only once AWS is configured.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_REGION != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the runtime image, tagged with the commit SHA
        run: |
          docker build --target runtime \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ledgerline:${{ github.sha }} .
      - name: The image starts and answers its liveness check
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e APP_ENV=development -e LLM_PROVIDER=fake -e STORAGE_BACKEND=local \
            -e STORAGE_DIR=/tmp/storage -e DATABASE_URL=postgresql+psycopg://nobody:x@localhost:1/none \
            ledgerline:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/livez && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: The image contains no test tools or generator
        run: |
          ! docker run --rm ledgerline:${{ github.sha }} python -c "import pytest" 2>/dev/null
          ! docker run --rm ledgerline:${{ github.sha }} python -c "import reportlab" 2>/dev/null
      # ---- Publish. The image pushed is the exact one built and tested above.
      # Credentials: a push-only IAM user's key in GitHub secrets (infra/staging/
      # github_ci.tf explains why not OIDC on this account). Secrets are never
      # given to pull requests from forks, and only these main-branch steps use them.
      - name: Log in to AWS
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push the tested image, tagged with the commit SHA
        if: env.PUBLISH == 'true'
        run: |
          image="${{ steps.ecr.outputs.registry }}/ledgerline:${{ github.sha }}"
          docker tag "ledgerline:${{ github.sha }}" "$image"
          docker push "$image"
          echo "Pushed \`$image\`" >> "$GITHUB_STEP_SUMMARY"
